[package]
name = "version-editor"
version = "2026.10.21"
edition = "2021"
description = "Editor de Versões e Datas Multi-idioma - Huginn Sentinel (Rust & egui)"
authors = ["Fernando Cidade"]

[[bin]]
name = "version-editor"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
regex = "1.11"
rfd = "0.17.2"
windows-sys = { version = "0.59.0", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
